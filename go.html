<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Abriendo…</title>
<style>body{margin:0;min-height:100svh;display:grid;place-items:center;background:#f4efe8;color:#2a2421;font:16px system-ui,sans-serif;text-align:center}a{color:#4b5239;font-weight:700}</style></head>
<body><p id="m">Abriendo catálogo…</p>
<script>
(async function () {
  var U = 'https://uazfgshpzvjxsckgkkeu.supabase.co/rest/v1/', K = 'sb_publishable_FQQiva6dasJhqpaRXqcl0A_2c5k0anJ';
  var c = (location.pathname.match(/\/l\/([a-z0-9]{5,10})\/?$/) || [])[1], m = document.getElementById('m');
  function fail() { m.innerHTML = 'Este enlace no existe. <a href="/">Ver negocios</a>'; }
  if (!c) return fail();
  try {
    var dev = /mobi|android|iphone/i.test(navigator.userAgent) ? 'móvil' : 'escritorio', ref = '';
    try { ref = document.referrer ? new URL(document.referrer).hostname.replace(/^www\./, '') : ''; } catch (e) {}
    var r = await fetch(U + 'rpc/short_resolve', { method: 'POST', headers: { apikey: K, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_code: c, p_ref: ref, p_device: dev }) });
    var t = await r.json();
    if (typeof t === 'string' && t.charAt(0) === '/') t = 'https://elyerromenu.com' + t;
    if (typeof t !== 'string' || !/^https:\/\/[^\s]+$/.test(t) || t.length > 2000) return fail();
    location.replace(t);
  } catch (e) { m.innerHTML = 'No se pudo abrir. Revisa tu conexión.'; }
})();
</script></body></html>
