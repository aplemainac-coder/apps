<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5eee7">
<meta name="description" content="Descubre los negocios registrados y entra a su catálogo para hacer tu pedido por WhatsApp.">
<title>Negocios registrados</title>
<style>
  :root { color-scheme:light; --crema:#FAF2EB; --tinta:#1C1A18; --terracota:#A7430C; --gris:#6E6964; --fondo:#eee5dc; --linea:rgba(28,26,24,.1); }
  * { box-sizing:border-box; }
  html { background:var(--fondo); }
  body { min-height:100svh; margin:0; background:radial-gradient(ellipse at top,#fffaf5 0,var(--fondo) 70%); color:var(--tinta); font-family:Arial,Helvetica,sans-serif; }
  a { color:inherit; }
  .page { width:min(100%,1040px); margin:0 auto; padding:calc(36px + env(safe-area-inset-top,0px)) 18px calc(48px + env(safe-area-inset-bottom,0px)); }

  header { display:grid; gap:10px; margin-bottom:26px; }
  h1 { margin:0; font:700 clamp(32px,7vw,52px)/1.08 Georgia,'DejaVu Serif',serif; letter-spacing:-.01em; }
  .lead { max-width:52ch; margin:0; color:var(--gris); font-size:16px; line-height:1.55; }

  .tools { display:flex; flex-wrap:wrap; align-items:center; gap:12px 16px; margin-bottom:22px; }
  .search { position:relative; flex:1 1 260px; max-width:420px; }
  .search input { width:100%; min-height:46px; padding:10px 16px; border:1px solid var(--linea); border-radius:999px; background:#fffaf6; color:var(--tinta); font:inherit; font-size:15px; }
  .search input::placeholder { color:#9a938c; }
  .search input:focus-visible { outline:3px solid #d87b45; outline-offset:2px; }
  .count { color:var(--gris); font-size:14px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:18px; margin:0; padding:0; list-style:none; }
  .card { display:flex; height:100%; flex-direction:column; overflow:hidden; border:1px solid var(--linea); border-radius:22px; background:var(--crema); text-decoration:none; box-shadow:0 10px 30px rgba(45,31,20,.08); transition:transform .18s ease, box-shadow .18s ease; }
  .card:hover { transform:translateY(-3px); box-shadow:0 16px 40px rgba(45,31,20,.15); }
  .card:focus-visible { outline:3px solid #d87b45; outline-offset:3px; }
  .cover { position:relative; aspect-ratio:16/10; background:#e9ddd1; }
  .cover img { display:block; width:100%; height:100%; object-fit:cover; }
  .cover .initial { display:grid; width:100%; height:100%; place-items:center; color:var(--terracota); font:700 64px Georgia,'DejaVu Serif',serif; }
  .logo { position:absolute; left:14px; bottom:-22px; width:52px; height:52px; border:3px solid var(--crema); border-radius:50%; background:#fff; object-fit:cover; }
  .body { display:flex; flex:1; flex-direction:column; gap:6px; padding:30px 18px 18px; }
  .body h2 { margin:0; font:700 20px/1.2 Georgia,'DejaVu Serif',serif; }
  .body p { margin:0; color:var(--gris); font-size:14px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .go { margin-top:auto; padding-top:10px; color:var(--terracota); font-size:14px; font-weight:700; }
  .card:hover .go { text-decoration:underline; text-underline-offset:3px; }

  .skeleton { height:250px; border-radius:22px; background:linear-gradient(90deg,#e9ddd1 25%,#f3e9df 50%,#e9ddd1 75%); background-size:200% 100%; animation:shimmer 1.3s infinite linear; }
  @keyframes shimmer { to { background-position:-200% 0; } }

  .state { display:grid; justify-items:center; gap:12px; padding:48px 16px; border:1px dashed rgba(167,67,12,.3); border-radius:22px; background:#fffaf6; text-align:center; }
  .state h2 { margin:0; font:700 22px Georgia,'DejaVu Serif',serif; }
  .state p { max-width:42ch; margin:0; color:var(--gris); font-size:15px; line-height:1.5; }
  .btn { min-height:44px; padding:10px 18px; border:0; border-radius:999px; background:var(--terracota); color:var(--crema); font:700 14px Arial,Helvetica,sans-serif; cursor:pointer; }
  .btn:hover { background:#8e3709; }
  .btn:focus-visible { outline:3px solid #d87b45; outline-offset:3px; }
  [hidden] { display:none !important; }
  @media (prefers-reduced-motion:reduce) { .card, .skeleton { transition:none; animation:none; } .card:hover { transform:none; } }
</style>
</head>
<body>
<main class="page">
  <header>
    <h1>Negocios registrados</h1>
    <p class="lead">Elige un negocio para ver su catálogo, sus horarios y hacer tu pedido por WhatsApp.</p>
  </header>

  <div class="tools" id="tools" hidden>
    <div class="search"><input id="q" type="search" placeholder="Buscar un negocio" aria-label="Buscar un negocio" autocomplete="off"></div>
    <span class="count" id="count" aria-live="polite"></span>
  </div>

  <ul class="grid" id="grid" aria-busy="true">
    <li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>
  </ul>

  <div class="state" id="state" hidden>
    <h2 id="state-title"></h2>
    <p id="state-text"></p>
    <button class="btn" id="retry" type="button" hidden>Reintentar</button>
  </div>
</main>

<script>
(function () {
  'use strict';

  var SUPABASE_URL = 'https://uazfgshpzvjxsckgkkeu.supabase.co';
  var SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_FQQiva6dasJhqpaRXqcl0A_2c5k0anJ';
  // Dirección del catálogo de cada negocio. Si tu hosting reescribe /b/<slug>/, cambia a '/b/' y '/'.
  var CATALOG_PREFIX = 'app.html?s=';
  var CATALOG_SUFFIX = '';

  var grid = document.getElementById('grid');
  var tools = document.getElementById('tools');
  var count = document.getElementById('count');
  var input = document.getElementById('q');
  var state = document.getElementById('state');
  var retry = document.getElementById('retry');
  var businesses = [];

  function safeImage(value) {
    try {
      var url = new URL(value);
      return url.origin === new URL(SUPABASE_URL).origin &&
        url.pathname.indexOf('/storage/v1/object/public/dwokd-site-assets/') === 0 ? url.href : '';
    } catch (e) { return ''; }
  }

  function normalize(text) {
    return String(text || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function showState(title, text, withRetry) {
    grid.hidden = true;
    tools.hidden = true;
    document.getElementById('state-title').textContent = title;
    document.getElementById('state-text').textContent = text;
    retry.hidden = !withRetry;
    state.hidden = false;
  }

  function toBusiness(row) {
    var settings = row.settings && typeof row.settings === 'object' ? row.settings : {};
    var content = settings.content && typeof settings.content === 'object' ? settings.content : {};
    var images = settings.images && typeof settings.images === 'object' ? settings.images : {};
    return {
      slug: row.slug,
      name: row.name || content.headline || row.slug,
      description: (typeof content.metaDescription === 'string' && content.metaDescription) ||
                   (typeof content.deliveryLabel === 'string' && content.deliveryLabel) || '',
      photo: safeImage(images.photoUrl),
      logo: safeImage(images.logoUrl)
    };
  }

  function render(list) {
    grid.textContent = '';
    grid.setAttribute('aria-busy', 'false');
    list.forEach(function (b) {
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'card';
      a.href = CATALOG_PREFIX + encodeURIComponent(b.slug) + CATALOG_SUFFIX;
      a.setAttribute('aria-label', 'Ver el catálogo de ' + b.name);

      var cover = document.createElement('div');
      cover.className = 'cover';
      var main = b.photo || b.logo;
      if (main) {
        var img = document.createElement('img');
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        img.src = main;
        img.addEventListener('error', function () { img.replaceWith(initial(b.name)); });
        cover.appendChild(img);
      } else {
        cover.appendChild(initial(b.name));
      }
      if (b.photo && b.logo) {
        var logo = document.createElement('img');
        logo.className = 'logo';
        logo.alt = '';
        logo.loading = 'lazy';
        logo.src = b.logo;
        cover.appendChild(logo);
      }

      var body = document.createElement('div');
      body.className = 'body';
      var h = document.createElement('h2');
      h.textContent = b.name;
      body.appendChild(h);
      if (b.description) {
        var p = document.createElement('p');
        p.textContent = b.description;
        body.appendChild(p);
      }
      var go = document.createElement('span');
      go.className = 'go';
      go.textContent = 'Ver catálogo';
      body.appendChild(go);

      a.appendChild(cover);
      a.appendChild(body);
      li.appendChild(a);
      grid.appendChild(li);
    });
    count.textContent = list.length + (list.length === 1 ? ' negocio' : ' negocios');
  }

  function initial(name) {
    var box = document.createElement('div');
    box.className = 'initial';
    box.textContent = (name || '?').trim().charAt(0).toUpperCase();
    return box;
  }

  function applyFilter() {
    var term = normalize(input.value.trim());
    var list = term ? businesses.filter(function (b) {
      return normalize(b.name + ' ' + b.description).indexOf(term) !== -1;
    }) : businesses;
    if (!list.length) {
      grid.textContent = '';
      count.textContent = '0 negocios';
      showState('Sin resultados', 'No encontramos ningún negocio con «' + input.value.trim() + '». Prueba con otro nombre.', false);
      tools.hidden = false;
      return;
    }
    state.hidden = true;
    grid.hidden = false;
    render(list);
  }

  async function load() {
    state.hidden = true;
    tools.hidden = true;
    grid.hidden = false;
    grid.setAttribute('aria-busy', 'true');
    grid.innerHTML = '<li class="skeleton"></li><li class="skeleton"></li><li class="skeleton"></li>';
    try {
      var response = await fetch(SUPABASE_URL + '/rest/v1/sites?select=slug,name,settings&order=name.asc', {
        headers: { apikey: SUPABASE_PUBLISHABLE_KEY },
        cache: 'no-store'
      });
      if (!response.ok) throw new Error('Error ' + response.status);
      var rows = await response.json();
      businesses = rows.filter(function (r) { return r && r.slug; }).map(toBusiness);
      if (!businesses.length) {
        showState('Aún no hay negocios', 'Cuando se registre el primer negocio aparecerá aquí.', false);
        return;
      }
      tools.hidden = false;
      applyFilter();
    } catch (error) {
      console.error('No se pudieron cargar los negocios.', error);
      showState('No se pudieron cargar los negocios', 'Revisa tu conexión e inténtalo de nuevo.', true);
    }
  }

  input.addEventListener('input', applyFilter);
  retry.addEventListener('click', load);
  load();
})();
</script>
</body>
</html>
